# Netdata StatsD charts for the API's request metrics (src/metrics.ts). Link or copy this file into
# Netdata's statsd.d/ config directory, then restart Netdata (it reads statsd.d/ only at start).
# Every metric also keeps its private chart, so a route added later shows up before it is listed here.

[app]
    name = ymusic_api
    metrics = ymusic.api.*
    private charts = yes
    gaps when not collected = no

[requests]
    name = requests
    title = Requests by route
    family = requests
    context = ymusic_api.requests
    units = requests/s
    type = stacked
    priority = 91000
    dimension = ymusic.api.requests.v1_sponsorblock_segments.get sponsorblock last 1 1
    dimension = ymusic.api.requests.v1_config.get config last 1 1
    dimension = ymusic.api.requests.v1_pulse.post pulse last 1 1
    dimension = ymusic.api.requests.v1_link.post link_create last 1 1
    dimension = ymusic.api.requests.v1_link_id.get link_get last 1 1
    dimension = ymusic.api.requests.v1_link_id.put link_put last 1 1
    dimension = ymusic.api.requests.v1_link_id.delete link_delete last 1 1
    dimension = ymusic.api.requests.healthz.get healthz last 1 1
    dimension = ymusic.api.requests.unmatched.get unmatched last 1 1

[status]
    name = status
    title = Responses by status class
    family = requests
    context = ymusic_api.status
    units = responses/s
    type = stacked
    priority = 91001
    dimension = ymusic.api.status.2xx 2xx last 1 1
    dimension = ymusic.api.status.3xx 3xx last 1 1
    dimension = ymusic.api.status.4xx 4xx last 1 1
    dimension = ymusic.api.status.5xx 5xx last 1 1

[errors]
    name = errors
    title = Errors by status code
    family = requests
    context = ymusic_api.errors
    units = responses/s
    type = stacked
    priority = 91002
    dimension = ymusic.api.errors.400 400 last 1 1
    dimension = ymusic.api.errors.401 401 last 1 1
    dimension = ymusic.api.errors.403 403 last 1 1
    dimension = ymusic.api.errors.404 404 last 1 1
    dimension = ymusic.api.errors.405 405 last 1 1
    dimension = ymusic.api.errors.409 409 last 1 1
    dimension = ymusic.api.errors.410 410 last 1 1
    dimension = ymusic.api.errors.413 413 last 1 1
    dimension = ymusic.api.errors.415 415 last 1 1
    dimension = ymusic.api.errors.429 429 last 1 1
    dimension = ymusic.api.errors.500 500 last 1 1
    dimension = ymusic.api.errors.502 502 last 1 1
    dimension = ymusic.api.errors.503 503 last 1 1
    dimension = ymusic.api.errors.504 504 last 1 1

[response_time_p95]
    name = response_time_p95
    title = Response time, 95th percentile
    family = latency
    context = ymusic_api.response_time_p95
    units = ms
    type = line
    priority = 91003
    dimension = ymusic.api.response_time.v1_sponsorblock_segments sponsorblock percentile 1 1
    dimension = ymusic.api.response_time.v1_config config percentile 1 1
    dimension = ymusic.api.response_time.v1_pulse pulse percentile 1 1
    dimension = ymusic.api.response_time.v1_link link_create percentile 1 1
    dimension = ymusic.api.response_time.v1_link_id link percentile 1 1

[response_time_max]
    name = response_time_max
    title = Response time, slowest
    family = latency
    context = ymusic_api.response_time_max
    units = ms
    type = line
    priority = 91004
    dimension = ymusic.api.response_time.v1_sponsorblock_segments sponsorblock max 1 1
    dimension = ymusic.api.response_time.v1_config config max 1 1
    dimension = ymusic.api.response_time.v1_pulse pulse max 1 1
    dimension = ymusic.api.response_time.v1_link link_create max 1 1
    dimension = ymusic.api.response_time.v1_link_id link max 1 1
